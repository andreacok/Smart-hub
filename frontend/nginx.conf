server {
    listen 80;
    server_name _;

    # Foto stanze caricate dall'utente: 10 MB di file più il margine multipart (default Nginx: 1 MB)
    client_max_body_size 11m;
    root /usr/share/nginx/html;
    index index.html;

    # API verso il backend Spring Boot (nome del servizio in docker-compose)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # predisposizione per Server-Sent Events / WebSocket futuri
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Documentazione API (Swagger UI) servita dal backend
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset con hash nel nome: cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: ogni altra rotta restituisce index.html (senza cache, così gli aggiornamenti arrivano subito)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
